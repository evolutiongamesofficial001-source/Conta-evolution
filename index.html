<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>EvoAccount</title>
<style>
:root{--bg:#05070d;--bg2:#0a0f1d;--card:#0f1526;--card2:#161f38;--line:#1f2b4a;--text:#f4f7ff;--muted:#8a96b8;--blue:#2f6bff;--danger:#ff4d6a;--ok:#2ecc8f;--r:18px;--fs:16px}
[data-theme=light]{--bg:#f2f5ff;--bg2:#ffffff;--card:#ffffff;--card2:#eaf0ff;--line:#d7e0fa;--text:#070b16;--muted:#5a6788}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:var(--fs)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100dvh;line-height:1.4}
body.noscroll{overflow:hidden}
body.rm *{animation:none!important;transition:none!important}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}.center{text-align:center}.grow{flex:1;min-width:0}
small{display:block;color:var(--muted);font-size:.8rem}
.ic{flex:none}
button{font-family:inherit}
/* layout */
.page{max-width:760px;margin:0 auto;padding:14px 16px calc(100px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 0 16px;gap:10px}
.top h1{font-size:1.5rem}
.brand{display:flex;align-items:center;gap:10px;font-size:1.25rem}
.brand b span,.brand h1 span{color:var(--blue)}
.logo{width:52px;height:52px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 8px 30px color-mix(in srgb,var(--blue) 45%,transparent)}
.logo.sm{width:34px;height:34px;border-radius:11px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
body.compact .card{padding:11px;margin-bottom:9px}
.tap{cursor:pointer}.tap:active{transform:scale(.985)}
.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 4px 8px}
.sec.nm{margin:0 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .card{margin-bottom:0}.grid2{margin-bottom:14px}
.stat{text-align:center}.stat b{display:block;font-size:2rem;color:var(--blue)}.stat span{color:var(--muted);font-size:.85rem}
/* buttons / inputs */
.btn{background:var(--blue);color:#fff;border:0;border-radius:14px;padding:13px 18px;font-weight:700;font-size:1rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{filter:brightness(.9)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:12px}
.btn.full{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}
.ib{background:none;border:0;color:var(--text);cursor:pointer;padding:6px;display:grid;place-items:center}
.fab{width:46px;height:46px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px color-mix(in srgb,var(--blue) 50%,transparent)}
input,textarea,select{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--line);border-radius:14px;padding:13px 14px;font-size:1rem;font-family:inherit;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 25%,transparent)}
input[type=range]{padding:0;height:30px;accent-color:var(--blue);border:0;background:none}
label.lbl{display:block;font-size:.82rem;color:var(--muted);margin:12px 2px 6px}
.err{color:var(--danger);font-size:.88rem;min-height:1.2em;margin:8px 2px}
.pw{position:relative}.pw input{padding-right:84px}
.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--blue);font-weight:700;cursor:pointer;padding:8px}
/* auth */
.auth{min-height:100dvh;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 500px at 50% -10%,color-mix(in srgb,var(--blue) 28%,transparent),transparent)}
.acard{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px}
.acard .brand{flex-direction:column;margin-bottom:18px}.acard h1{font-size:1.9rem}
.seg{display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;background:none;border:0;color:var(--muted);padding:9px 6px;border-radius:10px;font-weight:700;cursor:pointer;font-size:.9rem}
.seg button.on{background:var(--blue);color:#fff}
.tabs{margin-bottom:6px}
/* avatar & hero */
.av{border-radius:50%;object-fit:cover;background:linear-gradient(135deg,var(--blue),#0a2a8a);color:#fff;display:inline-grid;place-items:center;font-weight:800;flex:none}
.hero{text-align:center;padding:26px 16px;background:linear-gradient(180deg,color-mix(in srgb,var(--blue) 14%,var(--card)),var(--card))}
.avbtn{position:relative;background:none;border:0;padding:0;cursor:pointer;margin-bottom:10px}
.avbtn .av{border:3px solid var(--blue)}
.cam{position:absolute;right:2px;bottom:6px;width:32px;height:32px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;border:3px solid var(--card)}
.hero h2{font-size:1.5rem}
.idrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0;flex-wrap:wrap}
code{background:var(--bg2);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:1.05rem;font-weight:700;letter-spacing:.06em;color:var(--blue);font-family:ui-monospace,Menlo,Consolas,monospace}
.bio{margin:6px 0 0}
/* rows */
.row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{display:block;font-size:.95rem}
.row.tap:active{background:var(--card2)}
.ri{width:38px;height:38px;border-radius:12px;background:var(--card2);color:var(--blue);display:grid;place-items:center;flex:none}
.val{color:var(--muted);font-size:.9rem;text-align:right;word-break:break-all}
.pill{font-size:.72rem;font-weight:800;padding:3px 9px;border-radius:99px;background:color-mix(in srgb,var(--ok) 20%,transparent);color:var(--ok)}
.sw{position:relative;display:inline-block;width:50px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw i{position:absolute;inset:0;background:var(--card2);border:1px solid var(--line);border-radius:99px;transition:.2s}
.sw i:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.2s}
.sw input:checked+i{background:var(--blue);border-color:var(--blue)}
.sw input:checked+i:before{transform:translateX(20px);background:#fff}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.swatches button.on{border-color:var(--text)}
.mrow{display:flex;gap:10px;margin-top:16px}.mrow .btn{flex:1}
.empty{text-align:center;color:var(--muted);padding:28px 16px}
/* nav */
.navbar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 45%);z-index:20;pointer-events:none}
.navbar .in{pointer-events:auto;display:flex;gap:4px;width:100%;max-width:560px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:6px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
.navbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-weight:700;font-size:.68rem;padding:8px 2px;border-radius:18px;cursor:pointer;position:relative}
.navbar button.on{color:#fff;background:var(--blue)}
.dot{position:absolute;top:2px;right:18%;background:var(--danger);color:#fff;font-size:.65rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,4,10,.72);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.overlay.hidden{display:none}
.sheet{width:100%;max-width:460px;max-height:92dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:26px 26px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
.sheet h2{margin-bottom:6px}
@media(min-width:700px){.overlay{align-items:center}.sheet{border-radius:26px}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
#loader{align-items:center;background:var(--bg);z-index:80}
.ldbox{width:100%;max-width:380px;padding:28px;text-align:center}
.ldbox .logo{margin:0 auto 18px;width:72px;height:72px;border-radius:22px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#steps{list-style:none;padding:0;margin:22px 0;text-align:left}
#steps li{display:flex;align-items:center;gap:12px;padding:11px 4px;color:var(--muted);transition:.3s}
#steps li.act{color:var(--text)}#steps li.done{color:var(--ok)}
.sp{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
li.act .sp{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
li.done .sp{background:var(--ok);border-color:var(--ok);color:#fff}
li.done .sp:after{content:"✓";font-size:.8rem;font-weight:800}
@keyframes spin{to{transform:rotate(360deg)}}
.prog{height:6px;background:var(--card2);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--blue);transition:width .5s}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top));left:0;right:0;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.t{background:var(--card2);color:var(--text);border:1px solid var(--line);border-left:4px solid var(--blue);padding:11px 16px;border-radius:14px;max-width:90vw;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.4);animation:up .25s}
.t.err{border-left-color:var(--danger)}.t.ok{border-left-color:var(--ok)}.t.out{opacity:0;transition:.4s}
/* crop */
.cropwrap{display:grid;place-items:center;margin:14px 0}
#cv{width:240px;height:240px;border-radius:50%;border:3px solid var(--blue);touch-action:none;cursor:grab;background:#000}
/* friends */
.frow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px}
.frow b{display:block}
.acts{display:flex;gap:8px}
/* chat */
.conv{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;justify-content:center}
.cwrap{width:100%;max-width:760px;display:flex;flex-direction:column;height:100dvh;border-left:1px solid var(--line);border-right:1px solid var(--line)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--line)}
.warn{font-size:.78rem;background:color-mix(in srgb,var(--blue) 14%,var(--bg));color:var(--muted);padding:8px 14px;text-align:center}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:6px}
.b{max-width:78%;padding:9px 13px;border-radius:18px;display:flex;flex-direction:column;gap:2px}
.b span{white-space:pre-wrap;word-break:break-word}
.b time{font-size:.66rem;opacity:.65;align-self:flex-end}
.b.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:5px}
.b.th{align-self:flex-start;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:5px}
.dsep{align-self:center;font-size:.72rem;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px;margin:8px 0}
.comp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);align-items:flex-end}
.comp textarea{resize:none;max-height:120px;border-radius:20px;padding:11px 15px}
.comp .btn.send{width:48px;height:48px;padding:0;border-radius:50%;flex:none}
/* store */
.ext{display:flex;gap:14px;align-items:flex-start}
.exi{width:56px;height:56px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.ext .acts{margin-top:12px}
.ext .acts .btn{flex:1}
.meta{font-size:.78rem;color:var(--muted);margin:2px 0 6px}
.clockw{text-align:center}.clockw #clk{font-size:2.6rem;font-weight:800;letter-spacing:.04em;color:var(--blue)}
/* neon extension */
body.neon .card,body.neon .navbar .in,body.neon .frow{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue),0 0 22px color-mix(in srgb,var(--blue) 40%,transparent)}
body.neon .btn:not(.ghost){box-shadow:0 0 18px var(--blue)}
body.neon .av{box-shadow:0 0 26px var(--blue)}
body.neon code{text-shadow:0 0 10px var(--blue)}
</style>
</head>
<body>

  <ul id="steps"></ul>
  <div class="prog"><i id="pb"></i></div>
</div></div>

<script>
'use strict';
/* ============ CONFIG ============ */

let ac;function beep(){if(!ME||!ME.settings.sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.value=880;g.gain.setValueAtTime(.001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.2,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.25);o.start();o.stop(ac.currentTime+.26)}catch(e){}}

/* SHA-256 (usa crypto.subtle quando disponível; fallback em JS puro) */
function sha256js(bytes){
 const K=[],H=[];let c=0;

  if(p){if(c<8)H[c]=(Math.pow(n,.5)*4294967296)|0;K[c]=(Math.pow(n,1/3)*4294967296)|0;c++}}

 w[l>>2]|=0x80<<(24-(l%4)*8);w[total-1]=l*8;
 let h=H.slice(0,8);
 for(let o=0;o<total;o+=16){
  const W=w.slice(o,o+16),old=h.slice(0);
  for(let i=0;i<64;i++){
   if(i>=16){const a=W[i-15],b=W[i-2];

   const [a,b,c2,d,e,f,g,hh]=h;
   const S1=((e>>>6)|(e<<26))^((e>>>11)|(e<<21))^((e>>>25)|(e<<7));
   const ch=(e&f)^(~e&g),t1=(hh+S1+ch+K[i]+W[i])|0;
   const S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10));
   const maj=(a&b)^(a&c2)^(b&c2),t2=(S0+maj)|0;
   h=[(t1+t2)|0,a,b,c2,(d+t1)|0,e,f,g]}
  for(let i=0;i<8;i++)h[i]=(h[i]+old[i])|0}
 return h.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}
//END_SHA
async function sha256(str){
 const data=new TextEncoder().encode(str);
 if(window.crypto&&crypto.subtle){try{return hex(new Uint8Array(await crypto.subtle.digest('SHA-256',data)))}catch(e){}}
 return sha256js(data);
}

/* ============ FIREBASE (REST, 5 bancos) ============ */
let primary=0;
async function req(base,path,method,body){
 const c=new AbortController(),t=setTimeout(()=>c.abort(),TIMEOUT);
 try{
  const r=await fetch(base+'/'+path+'.json',{method,body:body===undefined?undefined:JSON.stringify(body),signal:c.signal});
  if(!r.ok)throw new Error('HTTP '+r.status);
  return await r.json();
 }finally{clearTimeout(t)}
}
const NOCONN='Sem conexão com os servidores Evo. Tente novamente.';
async function dbGet(path,any){
 if(any){
  const rs=await Promise.allSettled(DBS.map(b=>req(b,path,'GET')));
  const ok=rs.filter(r=>r.status==='fulfilled');
  if(!ok.length)throw new Error(NOCONN);
  const f=ok.find(r=>r.value!==null);return f?f.value:null;
 }
 for(let k=0;k<DBS.length;k++){const i=(k+primary)%DBS.length;
  try{const v=await req(DBS[i],path,'GET');primary=i;return v}catch(e){}}
 throw new Error(NOCONN);
}
function dbWrite(path,method,body){ /* grava nos 5; conclui quando o primeiro confirmar */
 return new Promise((res,rej)=>{let fails=0;
  DBS.forEach((b,i)=>req(b,path,method,body).then(()=>{primary=i;res()}).catch(()=>{if(++fails===DBS.length)rej(new Error(NOCONN))}))});
}
const dbSet=(p,v)=>dbWrite(p,'PUT',v),dbPatch=(p,v)=>dbWrite(p,'PATCH',v),dbDel=p=>dbWrite(p,'DELETE');
const dbDelAll=p=>Promise.allSettled(DBS.map(b=>req(b,p,'DELETE'))); /* espera todos */
async function pingAll(){
 S.servers=await Promise.all(DBS.map(async b=>{const t=performance.now();try{await req(b,'meta/chatReset','GET');return{ok:true,ms:Math.round(performance.now()-t)}}catch(e){return{ok:false,ms:0}}}));
 return S.servers;
}

const STEPS=['Conectando aos servidores evolution','Escrevendo sua segurança','Criando seu Evo id'];
function showLoader(){

 $('#steps').innerHTML=STEPS.map((t,i)=>`<li id="st${i}"><span class="sp"></span><em style="font-style:normal">${t}</em></li>`).join('');

const hideLoader=()=>$('#loader').classList.add('hidden');
async function runStep(i,fn){
 $('#st'+i).className='act';
 await Promise.all([fn(),sleep(1000)]);
 $('#st'+i).className='done';$('#pb').style.width=((i+1)/STEPS.length*100)+'%';

async function submitRegister(e){
 e.preventDefault();const f=e.target.elements,err=$('#err');
 const u=f.un.value.trim(),em=f.em.value.trim().toLowerCase(),p=f.pw.value,c=f.pw2.value;
 if(!/^[A-Za-z0-9_.-]{3,20}$/.test(u))return err.textContent='Nome de usuário: 3 a 20 caracteres (letras, números, _ . -).';
 if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em))return err.textContent='E-mail inválido.';
 if(p.length<6)return err.textContent='A senha precisa ter pelo menos 6 caracteres.';
 if(p!==c)return err.textContent='As senhas não coincidem.';
 err.textContent='';showLoader();
 try{
  let id,salt,hash;const now=Date.now();
  await runStep(0,async()=>{
   const [a,b]=await Promise.all([dbGet('idx/u/'+key(u.toLowerCase()),true),dbGet('idx/e/'+key(em),true)]);
   if(a)throw new Error('Esse nome de usuário já está em uso.');
   if(b)throw new Error('Esse e-mail já está cadastrado.');
  });
  await runStep(1,async()=>{salt=rnd(16);hash=await sha256(salt+':'+p)});
  await runStep(2,async()=>{
   do{id=genEvoId()}while(await dbGet('profiles/'+id,true));
   await Promise.all([
    dbSet('profiles/'+id,{username:u,photo:'',bio:'',allowRequests:true,created:now}),
    dbSet('users/'+id,{email:em,salt,hash,created:now,settings:{...DEF}}),
    dbSet('idx/u/'+key(u.toLowerCase()),id),dbSet('idx/e/'+key(em),id)]);
  });
  ME=buildMe(id,{username:u,created:now,allowRequests:true},{email:em,salt,hash,created:now,settings:{...DEF}});
  saveSession(id,hash);await sleep(500);hideLoader();enterApp();
  toast('Conta criada! Seu Evo ID: '+id,'ok');
 }catch(ex){hideLoader();$('#err').textContent=ex.message}
}

function cropModal(img){
 const st={z:1,ox:0,oy:0};
 openModal(`<h2>Ajustar foto</h2><p class="muted">Arraste para posicionar e use o zoom.</p><div class="cropwrap"><canvas id="cv" width="256" height="256"></canvas></div>
 <label class="lbl">Zoom</label><input type="range" id="zm" min="1" max="3" step="0.01" value="1">
 <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="svp">Salvar foto</button></div>`);
 const cv=$('#cv'),c=cv.getContext('2d');
 const draw=()=>{const base=256/Math.min(img.width,img.height)*st.z,w=img.width*base,h=img.height*base,mx=(w-256)/2,my=(h-256)/2;
  st.ox=Math.max(-mx,Math.min(mx,st.ox));st.oy=Math.max(-my,Math.min(my,st.oy));
  c.fillStyle='#000';c.fillRect(0,0,256,256);c.drawImage(img,128-w/2+st.ox,128-h/2+st.oy,w,h)};
 draw();$('#zm').oninput=e=>{st.z=+e.target.value;draw()};
 let drag=null;
 cv.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:st.ox,oy:st.oy};cv.setPointerCapture(e.pointerId)};
 cv.onpointermove=e=>{if(!drag)return;const k=256/cv.getBoundingClientRect().width;st.ox=drag.ox+(e.clientX-drag.x)*k;st.oy=drag.oy+(e.clientY-drag.y)*k;draw()};
 cv.onpointerup=cv.onpointercancel=()=>{drag=null};
 $('#svp').onclick=async()=>{
  const b=$('#svp');b.disabled=true;b.textContent='Salvando...';
  try{const data=cv.toDataURL('image/jpeg',.85);await dbSet('profiles/'+ME.id+'/photo',data);ME.photo=data;S.profiles[ME.id]=null;closeModal();renderPage();toast('Foto atualizada!','ok')}

}

 b.disabled=true;b.textContent='Enviando...';
 try{
  const [prof,isF,mine,theirs]=await Promise.all([dbGet('profiles/'+id,true),dbGet(`friends/${ME.id}/${id}`,true),dbGet(`requests/${ME.id}/${id}`,true),dbGet(`requests/${id}/${ME.id}`,true)]);
  if(!prof)throw new Error('Nenhuma conta encontrada com esse Evo ID.');
  if(isF)throw new Error('Vocês já são amigos.');
  if(mine){await acceptReq(id,true);closeModal();return toast('Vocês agora são amigos!','ok')}
  if(theirs)throw new Error('Solicitação já enviada. Aguarde a resposta.');
  if(prof.allowRequests===false)throw new Error('Essa pessoa não está aceitando solicitações.');
  await dbSet(`requests/${id}/${ME.id}`,{from:ME.id,ts:Date.now()});
  closeModal();toast('Solicitação enviada para '+prof.username,'ok');
 }catch(e){er(e.message);b.disabled=false;b.textContent='Enviar solicitação'}
}
async function acceptReq(id,quiet){
 try{const ts=Date.now();
  await Promise.all([dbSet(`friends/${ME.id}/${id}`,ts),dbSet(`friends/${id}/${ME.id}`,ts)]);
  await dbDel(`requests/${ME.id}/${id}`);if(!quiet)toast('Amigo adicionado!','ok');await refreshSocial();
 }catch(e){toast(e.message,'err')}
}
async function declineReq(id){try{await dbDel(`requests/${ME.id}/${id}`);S.reqs=S.reqs.filter(r=>r.id!==id);renderNav();renderPage()}catch(e){toast(e.message,'err')}}
async function removeFriend(id){
 const p=S.profiles[id];
 if(!await askConfirm('Remover amigo?',`Remover <b>${esc(p&&p.username)}</b> da sua lista? As mensagens do chat também serão apagadas.`,'Remover'))return;
 try{await Promise.all([dbDel(`friends/${ME.id}/${id}`),dbDel(`friends/${id}/${ME.id}`)]);dbDelAll('chats/'+cid(ME.id,id));
  S.friends=S.friends.filter(f=>f.id!==id);renderNav();renderPage();toast('Amigo removido')}catch(e){toast(e.message,'err')}
}

/* ============ CHAT ============ */
function resetText(){const n=new Date(),nx=new Date(n.getFullYear(),n.getMonth()+1,1),d=Math.ceil((nx-n)/864e5);return`⚠️ O chat é zerado todo dia 1 do mês. Próximo reset em ${d} dia${d>1?'s':''} (${nx.toLocaleDateString('pt-BR')}).`}
function vChat(){
 return`<div class="top"><h1>Chat Evo</h1></div>
 <div class="card" style="font-size:.88rem;border-color:var(--blue)">${resetText()}<br><span class="muted">Você só conversa com quem adicionou como amigo.</span></div>
 ${S.friends.length?S.friends.map(x=>`<div class="frow tap" onclick="openChat('${x.id}')">${av(x.p,46)}<div class="grow"><b>${esc(x.p&&x.p.username)}</b><small>Toque para conversar</small></div>${ic('chat',20)}</div>`).join('')
 :`<div class="card empty">Nenhum amigo ainda.<br><button class="btn" style="margin-top:12px" onclick="go('friends')">Adicionar amigos</button></div>`}`;
}
function openChat(fid){
 closeChat(true);const p=S.profiles[fid];
 S.chatWith=fid;S.msgs=[];S.pending=[];S.sig='';S.firstLoad=true;S.lastIn='';
 const d=document.createElement('div');d.className='conv';d.id='conv';
 d.innerHTML=`<div class="cwrap"><header class="chead"><button class="ib" onclick="closeChat()">${ic('back',24)}</button>${av(p,40)}<div class="grow"><b>${esc(p&&p.username)}</b><small>${fid}</small></div></header>
 <div class="warn">${resetText()}</div><div id="msgs" class="msgs"></div>
 <form class="comp" onsubmit="sendMsg(event)"><textarea id="mi" rows="1" maxlength="1000" placeholder="Escreva uma mensagem"></textarea><button class="btn send" type="submit" aria-label="Enviar">${ic('send',20)}</button></form></div>`;
 document.body.appendChild(d);document.body.classList.add('noscroll');
 const mi=$('#mi');
 mi.oninput=()=>{mi.style.height='auto';mi.style.height=Math.min(mi.scrollHeight,120)+'px'};
 mi.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&ME.settings.enterToSend&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();sendMsg(e)}};
 renderMsgs();pollChat();clearInterval(T.chat);T.chat=setInterval(()=>{if(!document.hidden)pollChat()},ME.settings.pollSec*1000);
}
function closeChat(silent){
 clearInterval(T.chat);const c=$('#conv');if(c)c.remove();document.body.classList.remove('noscroll');S.chatWith=null;if(!silent)renderPage();
}
async function pollChat(){
 const fid=S.chatWith;if(!fid)return;
 try{
  const o=(await dbGet('chats/'+cid(ME.id,fid)))||{};if(S.chatWith!==fid)return;
  const arr=Object.entries(o).filter(([k,v])=>v&&typeof v.t==='string').sort(([a],[b])=>a<b?-1:1).slice(-300).map(([k,v])=>({k,f:v.f,t:v.t,ts:v.ts}));
  S.pending=S.pending.filter(p=>!arr.some(m=>m.k===p.k));
  const last=arr[arr.length-1],sig=arr.length+'|'+(last?last.k:'')+'|'+S.pending.length;
  if(last&&last.f!==ME.id&&S.lastIn&&last.k!==S.lastIn)beep();
  S.lastIn=last&&last.f!==ME.id?last.k:S.lastIn;
  if(sig!==S.sig||S.firstLoad){S.msgs=arr;S.sig=sig;renderMsgs()}
 }catch(e){}
}
function renderMsgs(){
 const box=$('#msgs');if(!box)return;
 const near=S.firstLoad||box.scrollHeight-box.scrollTop-box.clientHeight<140;
 const all=[...S.msgs,...S.pending.filter(p=>!S.msgs.some(m=>m.k===p.k))];let last='';
 box.innerHTML=all.length?all.map(m=>{const d=new Date(m.ts),dk=d.toLocaleDateString('pt-BR');let sep='';if(dk!==last){last=dk;sep=`<div class="dsep">${dk}</div>`}
  return sep+`<div class="b ${m.f===ME.id?'me':'th'}"><span>${esc(m.t)}</span>${ME.settings.showTime?`<time>${hhmm(d)}</time>`:''}</div>`}).join('')
  :'<div class="muted center" style="margin:auto">Nenhuma mensagem ainda. Diga oi! 👋</div>';
 if(near)box.scrollTop=box.scrollHeight;S.firstLoad=false;
}
async function sendMsg(e){
 e.preventDefault();const mi=$('#mi'),t=mi.value.trim();if(!t||!S.chatWith)return;
 mi.value='';mi.style.height='auto';
 const k=String(Date.now()).padStart(13,'0')+'-'+rnd(3),m={k,f:ME.id,t,ts:Date.now()},fid=S.chatWith;
 S.pending.push(m);renderMsgs();
 try{await dbSet(`chats/${cid(ME.id,fid)}/${k}`,{f:m.f,t,ts:m.ts})}
 catch(ex){S.pending=S.pending.filter(x=>x.k!==k);renderMsgs();toast('Falha ao enviar a mensagem','err');if($('#mi'))$('#mi').value=t}
}
/* reset mensal: apaga TODOS os chats no 1º acesso de cada mês (dia 1) */
async function checkMonthlyReset(){
 try{
  const d=new Date(),mk=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
  const last=await dbGet('meta/chatReset',true);
  if(!last||mk>last){
   await dbDelAll('chats');await dbSet('meta/chatReset',mk);
   if(S.chatWith){S.msgs=[];S.pending=[];S.sig='';renderMsgs()}
  }
 }catch(e){}
}

/* ============ LOJA DE EXTENSÕES ============ */
function vStore(){
 return`<div class="top"><h1>Loja de extensões</h1></div><p class="muted" style="margin:-6px 4px 14px">Baixe extensões para turbinar o seu EvoAccount.</p>
 ${EXTS.map(x=>{const on=!!ME.extensions[x.id],pct=S.installing[x.id];
  return`<div class="card"><div class="ext"><span class="exi">${ic(x.icon,28)}</span><div class="grow"><b style="font-size:1.05rem">${x.name}</b> ${on?'<span class="pill">Instalada</span>':''}
  <div class="meta">v${x.ver} • ${x.size}</div><div>${x.desc}</div></div></div>
  ${pct!==undefined?`<div class="prog" style="margin-top:12px"><i style="width:${pct}%"></i></div><small style="margin-top:6px">Baixando… ${pct}%</small>`:''}
  <div class="acts"><button class="btn" ${on||pct!==undefined?'disabled':''} onclick="installExt('${x.id}')">${ic('download',18)} Baixar</button><button class="btn danger" ${!on||pct!==undefined?'disabled':''} onclick="deleteExt('${x.id}')">${ic('trash',18)} Deletar</button></div></div>`}).join('')}
 <div class="card empty">Novas extensões chegando em breve ✨</div>`;
}
function installExt(id){
 if(S.installing[id]!==undefined)return;S.installing[id]=0;renderPage();
 const iv=setInterval(async()=>{
  S.installing[id]=Math.min(100,S.installing[id]+Math.round(8+Math.random()*16));
  if(S.installing[id]>=100){
   clearInterval(iv);
   try{await dbSet(`users/${ME.id}/extensions/${id}`,true);ME.extensions[id]=true;applyExts();toast('Extensão instalada!','ok')}catch(e){toast(e.message,'err')}
   delete S.installing[id];
  }
  if(S.tab==='store')renderPage();
 },280);
}
async function deleteExt(id){
 const x=EXTS.find(e=>e.id===id);
 if(!await askConfirm('Deletar extensão?',`Remover <b>${x.name}</b> do seu EvoAccount?`,'Deletar'))return;
 try{await dbDel(`users/${ME.id}/extensions/${id}`);delete ME.extensions[id];applyExts();renderPage();toast('Extensão removida')}catch(e){toast(e.message,'err')}
}

/* ============ CONFIGURAÇÕES ============ */
function vSettings(){
 const s=ME.settings;
 const sw=k=>`<label class="sw"><input type="checkbox" ${s[k]?'checked':''} onchange="setS('${k}',this.checked)"><i></i></label>`;
 const row=(ico,t,sub,right='',oc='')=>`<div class="row${oc?' tap':''}"${oc?` onclick="${oc}"`:''}><span class="ri">${ic(ico)}</span><div class="grow"><b>${t}</b>${sub?`<small>${sub}</small>`:''}</div>${right}</div>`;
 const seg=(k,o)=>`<div class="seg" style="margin:4px 0 8px">${o.map(([v,l])=>`<button class="${s[k]==v?'on':''}" onclick="setS('${k}',${typeof v==='string'?`'${v}'`:v});renderPage()">${l}</button>`).join('')}</div>`;
 const sw2=['#2f6bff','#1d4ed8','#0a84ff','#00a2ff','#5b8cff'].map(c=>`<button style="background:${c}" class="${s.accent===c?'on':''}" onclick="setS('accent','${c}');renderPage()" aria-label="${c}"></button>`).join('');
 return`<div class="top"><h1>Configurações</h1></div>
 <h3 class="sec">Perfil</h3><div class="card">
  ${row('camera','Foto de perfil','Troque ou remova sua foto','', 'openPhotoMenu()')}
  ${row('user','Editar perfil','Nome de usuário e bio','', 'openEditProfile()')}
  ${row('bolt','Meu Evo ID',ME.id,`<button class="btn sm ghost" onclick="copyId()">${ic('copy',16)}</button>`)}
 </div>
 <h3 class="sec">Segurança</h3><div class="card">
  ${row('lock','Trocar senha','Exige a senha atual','', 'openChangePw()')}
  ${row('logout','Sair da conta','Encerrar sessão neste dispositivo','', 'doLogout()')}
 </div>
 <h3 class="sec">Aparência</h3><div class="card">
  <b>Tema</b>${seg('theme',[['dark','Escuro'],['light','Claro'],['auto','Auto']])}
  <b>Cor de destaque</b><div class="swatches" style="margin:8px 0 14px">${sw2}</div>
  <b>Tamanho da fonte: ${s.fontSize}px</b><input type="range" min="14" max="20" step="1" value="${s.fontSize}" oninput="setS('fontSize',+this.value,false)" onchange="setS('fontSize',+this.value);renderPage()">
  ${row('store','Modo compacto','Cartões com menos espaçamento',sw('compact'))}
  ${row('bolt','Reduzir animações','Para economizar bateria',sw('reduceMotion'))}
 </div>
 <h3 class="sec">Notificações</h3><div class="card">
  ${row('chat','Som de mensagens','Toca um aviso ao receber mensagem',sw('sound'))}
  ${row('users','Avisar solicitações','Mostrar aviso de novos pedidos de amizade',sw('notifyReq'))}
 </div>
 <h3 class="sec">Privacidade</h3><div class="card">
  ${row('users','Receber solicitações','Permitir que outros te adicionem pelo Evo ID',sw('allowRequests'))}
  ${row('lock','Ocultar meu e-mail','Mascara o e-mail no Dashboard',sw('hideEmail'))}
 </div>
 <h3 class="sec">Chat</h3><div class="card">
  ${row('send','Enter para enviar','No computador, Enter envia (Shift+Enter quebra linha)',sw('enterToSend'))}
  ${row('clock','Mostrar horário','Horário em cada mensagem',sw('showTime'))}
  <b>Atualizar o chat a cada</b>${seg('pollSec',[[2,'2s'],[4,'4s'],[8,'8s']])}
 </div>
 <h3 class="sec">Dados e servidores</h3><div class="card">
  ${row('store','Status dos servidores','Testar os 5 bancos Evo','', 'openServers()')}
  ${row('download','Exportar meus dados','Baixar um arquivo JSON','', 'exportData()')}
  ${row('trash','Limpar cache local','Recarrega perfis e preferências','', 'clearCache()')}
 </div>
 <h3 class="sec">Sobre</h3><div class="card">
  ${row('bolt','EvoAccount','Versão 1.0.0 • Ecossistema Evo')}
 </div>
 <h3 class="sec">Zona de perigo</h3><div class="card">
  ${row('trash','Excluir conta','Apaga sua conta e dados permanentemente','', 'openDelete()')}
 </div>`;
}
async function doLogout(){if(await askConfirm('Sair da conta?','Você precisará entrar novamente neste dispositivo.','Sair',false))logout()}
function openEditProfile(){
 openModal(`<h2>Editar perfil</h2><label class="lbl">Nome de usuário</label><input id="eu" value="${esc(ME.username)}" maxlength="20" autocapitalize="none">
 <label class="lbl">Bio (até 80 caracteres)</label><input id="eb" value="${esc(ME.bio)}" maxlength="80"><div class="err" id="eerr"></div>
 <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="esb">Salvar</button></div>`);
 $('#esb').onclick=async()=>{
  const u=$('#eu').value.trim(),b=$('#eb').value.trim(),er=m=>{$('#eerr').textContent=m};
  if(!/^[A-Za-z0-9_.-]{3,20}$/.test(u))return er('Nome de usuário: 3 a 20 caracteres (letras, números, _ . -).');
  $('#esb').disabled=true;
  try{
   if(u.toLowerCase()!==ME.username.toLowerCase()){
    const ex=await dbGet('idx/u/'+key(u.toLowerCase()),true);if(ex&&ex!==ME.id)throw new Error('Esse nome de usuário já está em uso.');
    await dbSet('idx/u/'+key(u.toLowerCase()),ME.id);await dbDel('idx/u/'+key(ME.username.toLowerCase()));
   }
   await dbPatch('profiles/'+ME.id,{username:u,bio:b});ME.username=u;ME.bio=b;S.profiles[ME.id]=null;
   closeModal();renderPage();toast('Perfil atualizado!','ok');
  }catch(e){er(e.message);$('#esb').disabled=false}
 };
}
function openChangePw(){
 openModal(`<h2>Trocar senha</h2><label class="lbl">Senha atual</label><input type="password" id="p0" autocomplete="current-password">
 <label class="lbl">Nova senha</label><input type="password" id="p1" autocomplete="new-password">
 <label class="lbl">Confirmar nova senha</label><input type="password" id="p2" autocomplete="new-password"><div class="err" id="perr"></div>
 <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn" id="psb">Alterar senha</button></div>`);
 $('#psb').onclick=async()=>{
  const a=$('#p0').value,b=$('#p1').value,c=$('#p2').value,er=m=>{$('#perr').textContent=m};
  if(!a||!b||!c)return er('Preencha todos os campos.');
  if(b.length<6)return er('A nova senha precisa ter pelo menos 6 caracteres.');
  if(b!==c)return er('A confirmação não coincide com a nova senha.');
  if(a===b)return er('A nova senha deve ser diferente da atual.');
  $('#psb').disabled=true;
  try{
   if(await sha256(ME.salt+':'+a)!==ME.hash)throw new Error('Senha atual incorreta.');
   const salt=rnd(16),hash=await sha256(salt+':'+b);
   await dbPatch('users/'+ME.id,{salt,hash});ME.salt=salt;ME.hash=hash;saveSession(ME.id,hash);
   closeModal();toast('Senha alterada com sucesso!','ok');
  }catch(e){er(e.message);$('#psb').disabled=false}
 };
}
async function openServers(){
 openModal('<h2>Servidores Evo</h2><p class="muted">Testando conexão…</p>');
 const r=await pingAll();
 openModal(`<h2>Servidores Evo</h2><p class="muted">${r.filter(x=>x.ok).length} de ${DBS.length} online</p>${r.map((x,i)=>`<div class="row"><span class="ri" style="color:${x.ok?'var(--ok)':'var(--danger)'}">${ic(x.ok?'check':'x')}</span><div class="grow"><b>Evo Server ${i+1}</b><small>${x.ok?x.ms+' ms':'Offline'}</small></div></div>`).join('')}<div class="mrow"><button class="btn" onclick="closeModal()">Fechar</button></div>`);
}
function exportData(){
 const d={evoId:ME.id,username:ME.username,email:ME.email,bio:ME.bio,created:ME.created,settings:ME.settings,extensions:ME.extensions,friends:S.friends.map(f=>f.id),exportedAt:new Date().toISOString()};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=`evoaccount-${ME.id}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Dados exportados','ok');
}
function clearCache(){S.profiles={};S.servers=null;refreshSocial();pingAll().then(updateServers);toast('Cache limpo','ok')}
function openDelete(){
 openModal(`<h2 style="color:var(--danger)">Excluir conta</h2><p class="muted">Isso apaga seu perfil, amigos e conversas de forma permanente. Confirme com sua senha.</p>
 <input type="password" id="dp" placeholder="Sua senha" autocomplete="current-password"><div class="err" id="derr"></div>
 <div class="mrow"><button class="btn ghost" onclick="closeModal()">Cancelar</button><button class="btn danger" id="dsb">Excluir</button></div>`);
 $('#dsb').onclick=async()=>{
  $('#dsb').disabled=true;
  try{
   if(await sha256(ME.salt+':'+$('#dp').value)!==ME.hash)throw new Error('Senha incorreta.');
   const id=ME.id,fids=S.friends.map(f=>f.id);
   await Promise.all([dbDelAll('profiles/'+id),dbDelAll('users/'+id),dbDelAll('idx/u/'+key(ME.username.toLowerCase())),dbDelAll('idx/e/'+key(ME.email)),dbDelAll('friends/'+id),dbDelAll('requests/'+id),
    ...fids.map(f=>dbDelAll(`friends/${f}/${id}`)),...fids.map(f=>dbDelAll('chats/'+cid(id,f)))]);
   localStorage.removeItem('evo_settings');logout();toast('Conta excluída');
  }catch(e){$('#derr').textContent=e.message;$('#dsb').disabled=false}
 };
}

boot();
</script>
